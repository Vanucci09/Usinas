<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proposta Expirada</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container">

        <div
            class="d-flex align-items-center justify-content-center"
            style="min-height: 100vh;"
        >

            <div
                class="card border-0 shadow-sm text-center"
                style="max-width: 550px; width: 100%;"
            >

                <div class="card-body p-5">

                    <div
                        class="text-danger mb-4"
                        style="font-size: 60px;"
                    >
                        &#10006;
                    </div>

                    <h2 class="fw-bold mb-3">
                        Proposta Expirada
                    </h2>

                    <p class="text-muted mb-3">
                        Esta proposta comercial não está mais disponível.
                    </p>

                    <p class="text-muted mb-0">
                        O prazo para aprovação desta proposta foi encerrado.
                        Entre em contato com nossa equipe comercial para
                        solicitar uma nova proposta.
                    </p>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
